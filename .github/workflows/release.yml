name: release

# Push a tag like v0.3.0 to publish. "Run workflow" (workflow_dispatch) only builds
# the binaries as workflow artifacts (dry run) and never publishes, even on a tag ref.
#
# Maintainers: restrict who can create v* tags (Settings > Rules > Rulesets) and
# add required reviewers to the "release" environment so a stray push cannot publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: tar.gz }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz }
          - { os: macos-latest, target: x86_64-apple-darwin, ext: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: versions agree (tag, Cargo.toml, plugin.json)
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          plugin=$(python3 -c 'import json;print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])')
          test "$version" = "$plugin" || { echo "Cargo.toml $version != plugin.json $plugin"; exit 1; }
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != Cargo.toml v$version"; exit 1; }
          fi
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Never publish a binary that cannot run a real node + controller on its own platform.
      # (The Intel macOS build is cross-compiled on an Apple-silicon runner, so it is not run here.)
      - name: smoke test the release binary (unix)
        if: runner.os != 'Windows' && matrix.target != 'x86_64-apple-darwin'
        run: bash scripts/smoke.sh target/${{ matrix.target }}/release/rcu
      - name: smoke test the release binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke.ps1 target/${{ matrix.target }}/release/rcu.exe
      - name: package (unix)
        if: matrix.ext == 'tar.gz'
        run: |
          tar -czf rcu-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release rcu
      - name: package (windows)
        if: matrix.ext == 'zip'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/rcu.exe -DestinationPath rcu-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: rcu-${{ matrix.target }}
          path: rcu-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  publish:
    needs: build
    # Only a pushed v* tag publishes. A manual run on a tag ref must not.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums (binaries and the skill file)
        run: |
          cp plugin/skills/remote-computer-use/SKILL.md dist/SKILL.md
          cd dist && sha256sum rcu-* SKILL.md > SHA256SUMS && cat SHA256SUMS
      - name: build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/rcu-*
            dist/SKILL.md
      - name: create release (draft, then publish once assets are uploaded)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
