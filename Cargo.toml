[package]
name = "rcu"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Jay-Hyun/remote-computer-use"
readme = "README.md"
keywords = ["remote", "tailscale", "agent", "cli"]
categories = ["command-line-utilities"]
rust-version = "1.89"
description = "remote-computer-use: node agent and controller CLI"

[lib]
name = "rcu"
path = "src/lib.rs"

[[bin]]
name = "rcu"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
directories = "5"
globset = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", default-features = false, features = ["limit"] }
tower-http = { version = "0.6", default-features = false, features = ["timeout"] }
ureq = { version = "2", default-features = false, features = ["json", "socks-proxy"] }

[dev-dependencies]
tempfile = "3"

# 맥·윈도우만 OS 보안 저장소 사용. 리눅스(클라우드 컨테이너 포함)는 환경 변수 토큰.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
