# 복사해서 노드의 policy.toml 로 쓴다. 위치는 `rcu policy-check` 로 확인.
# 기본은 모두 꺼짐. 필요한 것만 켠다.

[node]
name = "mac-home"

[capabilities]
exec = true
fs_read = true
fs_write = false
screen = false   # 화면 캡처(스크린샷을 컨트롤러로 보냄). 켜면 매번 승인
input = false    # 클릭·타이핑·키. 켜면 항상 매번 승인, 분당 20회

[fs]
roots = ["~/work"]
deny = ["**/.env", "**/.ssh/**", "**/*.pem", "**/*.key"]
max_read_bytes = 1048576

# 셸·래퍼는 넣을 수 없다. 절대 경로 + 좁은 인자 패턴.
[[exec.allow]]
program = "/usr/bin/git"
args = ["status", "*"]
risk = "read"

[[exec.allow]]
program = "/usr/bin/uptime"
risk = "read"

# 선택: 기본값을 바꾸고 싶을 때만 켠다.
# [exec]
# timeout_secs = 30          # 명령 실행 제한(최대 600)
# max_output_bytes = 65536   # stdout/stderr 각각의 상한
#
# [auth]
# token_days = 90            # 페어링으로 발급하는 토큰의 유효 기간(일). 0 = 무기한(기본)
#
# [approval]
# ui = "auto"               # auto | terminal | dialog. 대화상자(맥·윈도우·zenity)를 쓸지. 서비스로 돌 때는 dialog 가 필요
# grant_minutes = 60         # "a" 로 승인했을 때 유지 시간
# http_wait_secs = 60        # 컨트롤러 요청 하나가 승인을 기다리는 시간. 넘기면 exit 3 + approval_id
#
# [limits]
# per_minute = 60            # 토큰당
# per_day = 2000             # 노드 전체
